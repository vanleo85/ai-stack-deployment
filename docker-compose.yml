services:
  vllm-qwen:
    image: vllm/vllm-openai:latest
    restart: unless-stopped
    ports:
      - "${QWEN_PORT}:${VLLM_PORT}"
      - "${VLLM_METRICS_PORT:-9090}:9090"
    environment:
      HF_HOME: "/root/.cache/huggingface"
      HF_TOKEN: ${HF_TOKEN}
      # API ключ для аутентификации клиентов (OpenAI Bearer token)
      VLLM_API_KEY: ${VLLM_API_KEY}
      # vLLM flags — передаются в entrypoint.sh для добавления CLI-аргументов
      VLLM_ENFORCE_EAGER: ${VLLM_ENFORCE_EAGER:-false}
      VLLM_ENABLE_CHUNKED_PREFILL: ${VLLM_ENABLE_CHUNKED_PREFILL:-true}
      VLLM_ENABLE_PREFIX_CACHING: ${VLLM_ENABLE_PREFIX_CACHING:-true}
      VLLM_ENABLE_REASONING: ${VLLM_ENABLE_REASONING:-true}
    volumes:
      - ./data/hf-cache:/root/.cache/huggingface
      - ./vllm/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${VLLM_PORT}/health || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 300s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    entrypoint: ["entrypoint.sh"]
    command:
      [
        "${QWEN_MODEL}",
        "--dtype", "bfloat16",
        "--tensor-parallel-size", "1",
        "--host", "0.0.0.0",
        "--port", "${VLLM_PORT}",
        "--trust-remote-code",
        "--max-model-len", "${VLLM_MAX_MODEL_LEN:-8192}",
        "--gpu-memory-utilization", "${VLLM_GPU_MEMORY_UTILIZATION:-0.95}",
        "--max-num-seqs", "${VLLM_MAX_NUM_SEQS:-16}",
        "--max-num-batched-tokens", "${VLLM_MAX_NUM_BATCHED_TOKENS:-8192}",
        "--scheduling-policy", "${VLLM_SCHEDULING_POLICY:-fcfs}"
      ]

  embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    restart: unless-stopped
    ports:
      - "${EMBEDDING_PORT:-6006}:80"
    environment:
      HF_HOME: "/data"
      HF_TOKEN: ${HF_TOKEN}
    volumes:
      - ./data/hf-cache:/data
    # NOTE: No GPU reservation — runs on CPU to share GPU with vLLM
    # bge-m3-v2 is fast enough on CPU for most workloads
    command:
      [
        "--model-id", "${EMBEDDING_MODEL:-BAAI/bge-m3}",
        "--dtype", "float32",
        "--max-batch-tokens", "16384",
        "--max-client-batch-size", "32"
      ]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # GPU-аналог сервиса `embedding`: тот же TEI, та же модель и тот же API
  # POST /embed (inputs -> [[float x 1024]]), но с ускорением на NVIDIA GPU.
  # Пулинг TEI берёт из 1_Pooling/config.json модели (у bge-m3 это CLS),
  # поэтому --pooling не указываем — как и в CPU-варианте.
  # Делит видеокарту с vllm-qwen и reranker-gpu: резервация GPU даёт доступ
  # к устройству, но НЕ резервирует VRAM. При отключённом vllm-qwen оба
  # GPU-сервиса уживаются (~5 GB из 24 GB).
  embedding-gpu:
    image: ghcr.io/huggingface/text-embeddings-inference:${EMBEDDING_GPU_IMAGE_TAG:-89-1.9}
    restart: unless-stopped
    ports:
      - "${EMBEDDING_GPU_PORT:-6009}:80"
    environment:
      HF_HOME: "/data"
      # TEI-образы (и CPU, и CUDA) сами ставят HUGGINGFACE_HUB_CACHE=/data
      # через ENV в Dockerfile, поэтому общий том ./data/hf-cache
      # переиспользуется между CPU- и GPU-сервисами — модель не качается дважды.
      # HF_HOME — отдельная переменная и на путь кеша Hub не влияет.
      HUGGINGFACE_HUB_CACHE: "/data"
      HF_TOKEN: ${HF_TOKEN}
    volumes:
      - ./data/hf-cache:/data
    command:
      [
        "--model-id", "${EMBEDDING_GPU_MODEL:-BAAI/bge-m3}",
        "--dtype", "${EMBEDDING_GPU_DTYPE:-float16}",
        "--max-batch-tokens", "${EMBEDDING_GPU_MAX_BATCH_TOKENS:-16384}",
        "--max-client-batch-size", "${EMBEDDING_GPU_MAX_CLIENT_BATCH_SIZE:-64}"
      ]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    restart: unless-stopped
    ports:
      - "${RERANKER_PORT:-6007}:80"
    environment:
      HF_HOME: "/data"
      HF_TOKEN: ${HF_TOKEN}
    volumes:
      - ./data/hf-cache:/data
    # NOTE: No GPU reservation — runs on CPU to share GPU with vLLM
    # bge-reranker-v2-m3 is fast enough on CPU for most workloads
    command:
      [
        "--model-id", "${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}",
        "--dtype", "float32",
        "--max-batch-tokens", "8192",
        "--max-client-batch-size", "16"
      ]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # GPU-аналог сервиса `reranker`: тот же TEI, та же модель и тот же API
  # POST /rerank (query + texts + top_n), но с ускорением на NVIDIA GPU.
  # Работает на той же видеокарте, что и vllm-qwen. Резервация GPU даёт
  # доступ к устройству, но НЕ резервирует VRAM — чтобы избежать конфликта
  # памяти, поднимайте этот сервис при отключённом vllm-qwen
  # (docker compose stop vllm-qwen), либо снизьте VLLM_GPU_MEMORY_UTILIZATION.
  reranker-gpu:
    image: ghcr.io/huggingface/text-embeddings-inference:${RERANKER_GPU_IMAGE_TAG:-89-1.9}
    restart: unless-stopped
    ports:
      - "${RERANKER_GPU_PORT:-6008}:80"
    environment:
      HF_HOME: "/data"
      # TEI-образы (и CPU, и CUDA) сами ставят HUGGINGFACE_HUB_CACHE=/data
      # через ENV в Dockerfile, поэтому общий том ./data/hf-cache
      # переиспользуется между CPU- и GPU-сервисами — модель не качается дважды.
      # HF_HOME — отдельная переменная и на путь кеша Hub не влияет.
      HUGGINGFACE_HUB_CACHE: "/data"
      HF_TOKEN: ${HF_TOKEN}
    volumes:
      - ./data/hf-cache:/data
    command:
      [
        "--model-id", "${RERANKER_GPU_MODEL:-BAAI/bge-reranker-v2-m3}",
        "--dtype", "${RERANKER_GPU_DTYPE:-float16}",
        "--max-batch-tokens", "${RERANKER_GPU_MAX_BATCH_TOKENS:-16384}",
        "--max-client-batch-size", "${RERANKER_GPU_MAX_CLIENT_BATCH_SIZE:-64}"
      ]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
