services:
  vllm-qwen:
    image: vllm/vllm-openai:latest
    restart: unless-stopped
    ports:
      - "${QWEN_PORT}:${VLLM_PORT}"
      - "${VLLM_METRICS_PORT:-9090}:9090"
    environment:
      HF_HOME: "/root/.cache/huggingface"
      # HF_TOKEN: ${HF_TOKEN}  # раскомментировать для приватных моделей
    volumes:
      - ./data/hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${VLLM_PORT}/health || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 300s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    entrypoint: ["vllm"]
    command:
      [
        "serve",
        "${QWEN_MODEL}",
        "--dtype", "bfloat16",
        "--tensor-parallel-size", "1",
        "--host", "0.0.0.0",
        "--port", "${VLLM_PORT}",
        "--trust-remote-code",
        "--max-model-len", "${VLLM_MAX_MODEL_LEN:-16384}",
        "--gpu-memory-utilization", "${VLLM_GPU_MEMORY_UTILIZATION:-0.92}",
        "--max-num-seqs", "${VLLM_MAX_NUM_SEQS:-128}",
        "--max-num-batched-tokens", "${VLLM_MAX_NUM_BATCHED_TOKENS:-16384}",
        "--enable-chunked-prefill",
        "--enable-prefix-caching",
        "--scheduling-policy", "${VLLM_SCHEDULING_POLICY:-fcfs}"
      ]
